version: v2
name: openclaw-larry

build:
  method: docker
  context: .
  dockerfile: ./Dockerfile

services:
  - name: web
    type: web
    port: 8080
    cpuCores: 4
    ramMegabytes: 8192
    instances: 1
    terminationGracePeriodSeconds: 30
    domains:
      - name: web-15002-6b362a46-5h37bm0p.onporter.run
    connections:
      - type: disk
        config:
          diskName: openclaw-larry-data
    healthCheck:
      httpPath: /setup/healthz
      timeoutSeconds: 5
      initialDelaySeconds: 30

envGroups:
  - openclaw-larry-secrets
  - openclaw-larry-config
